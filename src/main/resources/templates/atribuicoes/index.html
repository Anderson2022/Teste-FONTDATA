<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Atribuições</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
  </head>
  <body class="app-page page-atribuicoes">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container-fluid">
      <div class="row">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-9 col-lg-10">
          <header class="page-heading">
            <h1>Atribuições</h1>
            <p>Selecione um usuário para gerenciar suas tarefas.</p>
          </header>
          <div
            th:if="${sucesso}"
            class="alert alert-success"
            th:text="${sucesso}"
          ></div>
          <div
            th:if="${erro}"
            class="alert alert-danger"
            th:text="${erro}"
          ></div>
          <form
            class="panel-card p-4 mb-4"
            method="get"
            th:action="@{/atribuicoes}"
          >
            <label class="form-label" for="usuarioId">Usuário</label>
            <div class="d-flex gap-2">
              <select
                class="form-select"
                id="usuarioId"
                name="usuarioId"
                required
                onchange="this.form.submit()"
              >
                <option value="">Selecione</option>
                <option
                  th:each="usuario : ${usuarios}"
                  th:value="${usuario.id}"
                  th:text="${usuario.nome + ' (' + usuario.username + ')'}"
                  th:selected="${usuario.id == usuarioId}"
                ></option></select
              ><button class="btn btn-primary">Consultar</button>
            </div>
          </form>
          <div th:if="${usuarioSelecionado != null}">
            <section class="panel-card p-4 mb-4">
              <div class="row">
                <div class="col-md">
                  <small class="text-secondary">Nome</small>
                  <div
                    class="fw-semibold"
                    th:text="${usuarioSelecionado.nome}"
                  ></div>
                </div>
                <div class="col-md">
                  <small class="text-secondary">Usuário</small>
                  <div th:text="${usuarioSelecionado.username}"></div>
                </div>
                <div class="col-md">
                  <small class="text-secondary">Perfil</small>
                  <div th:text="${usuarioSelecionado.perfil.descricao}"></div>
                </div>
              </div>
            </section>
            <section class="panel-card p-4 mb-4">
              <h2 class="h6 mb-3">Atribuir tarefa</h2>
              <form
                class="d-flex gap-2"
                method="post"
                th:action="@{/atribuicoes}"
              >
                <input
                  type="hidden"
                  name="usuarioId"
                  th:value="${usuarioSelecionado.id}"
                /><select class="form-select" name="tarefaId" required>
                  <option value="">Selecione uma tarefa disponível</option>
                  <option
                    th:each="tarefa : ${tarefasDisponiveis}"
                    th:value="${tarefa.id}"
                    th:text="${tarefa.nome + ' — ' + tarefa.tipo.nome + (tarefa.cliente != null ? ' — ' + tarefa.cliente.nome : '')}"
                  ></option></select
                ><button
                  class="btn btn-primary text-nowrap"
                  th:disabled="${#lists.isEmpty(tarefasDisponiveis)}"
                >
                  <i class="bi bi-plus-lg me-2"></i>Atribuir
                </button>
              </form>
            </section>
            <section class="panel-card users-card">
              <div class="card-header bg-white py-3">
                <strong
                  >Tarefas atribuídas a
                  <span th:text="${usuarioSelecionado.nome}"></span
                ></strong>
              </div>
              <div class="table-responsive">
                <table class="table app-table align-middle">
                  <thead>
                    <tr>
                      <th>Código</th>
                      <th>Tarefa</th>
                      <th>Descrição</th>
                      <th>Tipo</th>
                      <th>Classificação</th>
                      <th>Cliente</th>
                      <th class="text-end">Ação</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="item : ${atribuicoes}">
                      <td th:text="${item.tarefa.id}"></td>
                      <td th:text="${item.tarefa.nome}"></td>
                      <td th:text="${item.tarefa.descricao}"></td>
                      <td th:text="${item.tarefa.tipo.nome}"></td>
                      <td th:text="${item.tarefa.classificacao.descricao}"></td>
                      <td
                        th:text="${item.tarefa.cliente != null ? item.tarefa.cliente.nome : '—'}"
                      ></td>
                      <td class="text-end">
                        <form
                          th:action="@{/atribuicoes/{id}/remover(id=${item.id})}"
                          method="post"
                          onsubmit="
                            return confirm('Deseja remover esta atribuição?');
                          "
                        >
                          <input
                            type="hidden"
                            name="usuarioId"
                            th:value="${usuarioSelecionado.id}"
                          /><button
                            class="btn btn-outline-danger action-btn"
                            title="Remover"
                          >
                            <i class="bi bi-trash3-fill"></i>
                          </button>
                        </form>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(atribuicoes)}">
                      <td colspan="7" class="text-center text-secondary py-5">
                        Nenhuma tarefa atribuída.
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>

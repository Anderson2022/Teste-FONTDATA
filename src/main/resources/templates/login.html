<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar | Controle de Tarefas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head>
<body class="login-bg d-flex align-items-center min-vh-100">
<main class="container"><div class="row justify-content-center"><div class="col-sm-9 col-md-6 col-lg-4">
<div class="card border-0 shadow-lg"><div class="card-body p-4 p-lg-5"><h1 class="h3 mb-2">Controle de Tarefas</h1><p class="text-secondary mb-4">Entre para acessar o sistema</p>
<div th:if="${param.erro}" class="alert alert-danger">Usuário ou senha inválidos.</div><div th:if="${param.logout}" class="alert alert-success">Sessão encerrada.</div>
<form th:action="@{/login}" method="post"><div class="mb-3"><label for="username" class="form-label">Usuário</label><input id="username" name="username" class="form-control" required autofocus autocomplete="username"></div>
<div class="mb-4"><label for="password" class="form-label">Senha</label><input id="password" name="password" type="password" class="form-control" required autocomplete="current-password"></div>
<button class="btn btn-primary w-100" type="submit">Entrar</button></form></div></div></div></div></main></body></html>

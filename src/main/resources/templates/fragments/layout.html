<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <header th:fragment="navbar" class="app-topbar">
      <div class="user-menu">
        <span
          class="user-avatar"
          aria-hidden="true"
          th:text="${#strings.toUpperCase(#strings.substring(#authentication.name,0,1))}"
          >A</span
        >
        <span sec:authentication="name">Administrador</span>
        <i class="bi bi-chevron-down small" aria-hidden="true"></i>
        <form class="ms-2" th:action="@{/logout}" method="post">
          <button class="logout-btn" type="submit">
            <i class="bi bi-box-arrow-right me-2"></i>Sair
          </button>
        </form>
      </div>
    </header>
    <aside th:fragment="sidebar" class="sidebar">
      <a class="sidebar-brand" th:href="@{/}">
        <span class="brand-icon"><i class="bi bi-clipboard2-check"></i></span>
        <span>Controle de Tarefas</span>
      </a>
      <nav class="nav flex-column sidebar-nav">
        <a
          sec:authorize="hasRole('SUPERVISOR')"
          class="nav-link nav-dashboard"
          th:href="@{/dashboard}"
          ><i class="bi bi-house-door"></i><span>Dashboard</span></a
        >
        <a
          sec:authorize="hasRole('SUPERVISOR')"
          class="nav-link nav-usuarios"
          th:href="@{/usuarios}"
          ><i class="bi bi-person"></i><span>Usuários</span></a
        >
        <a
          sec:authorize="hasRole('SUPERVISOR')"
          class="nav-link nav-tarefas"
          th:href="@{/tarefas}"
          ><i class="bi bi-card-checklist"></i><span>Tarefas</span></a
        >
        <a
          sec:authorize="hasRole('SUPERVISOR')"
          class="nav-link nav-tipos"
          th:href="@{/tipos-tarefa}"
          ><i class="bi bi-tags"></i><span>Tipos de tarefa</span></a
        >
        <a
          sec:authorize="hasRole('SUPERVISOR')"
          class="nav-link nav-clientes"
          th:href="@{/clientes}"
          ><i class="bi bi-building"></i><span>Clientes</span></a
        >
        <a
          sec:authorize="hasRole('SUPERVISOR')"
          class="nav-link nav-atribuicoes"
          th:href="@{/atribuicoes}"
          ><i class="bi bi-people"></i><span>Atribuições</span></a
        >
        <a class="nav-link nav-minhas" th:href="@{/minhas-tarefas}"
          ><i class="bi bi-check2-square"></i><span>Minhas tarefas</span></a
        >
      </nav>
    </aside>
  </body>
</html>

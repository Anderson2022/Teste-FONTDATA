<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tarefa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
  </head>
  <body class="app-page page-tarefas">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container-fluid">
      <div class="row">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-9 col-lg-10">
          <header class="page-heading">
            <h1
              th:text="${tarefaForm.id == null ? 'Nova tarefa' : 'Editar tarefa'}"
            ></h1>
            <p>
              Preencha os dados e indique se a tarefa é interna ou de cliente.
            </p>
          </header>
          <div
            th:if="${erro}"
            class="alert alert-danger"
            th:text="${erro}"
          ></div>
          <section class="panel-card p-4">
            <form
              th:object="${tarefaForm}"
              th:action="${tarefaForm.id == null ? '/tarefas' : '/tarefas/' + tarefaForm.id}"
              method="post"
              novalidate
            >
              <div class="mb-3">
                <label class="form-label" for="nome">Nome *</label
                ><input
                  class="form-control"
                  id="nome"
                  th:field="*{nome}"
                  th:errorclass="is-invalid"
                  maxlength="150"
                />
                <div class="invalid-feedback" th:errors="*{nome}"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="descricao">Descrição *</label
                ><textarea
                  class="form-control"
                  id="descricao"
                  th:field="*{descricao}"
                  th:errorclass="is-invalid"
                  maxlength="500"
                  rows="4"
                ></textarea>
                <div class="invalid-feedback" th:errors="*{descricao}"></div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label" for="tipoId">Tipo *</label
                  ><select
                    class="form-select"
                    id="tipoId"
                    th:field="*{tipoId}"
                    th:errorclass="is-invalid"
                  >
                    <option value="">Selecione</option>
                    <option
                      th:each="tipo : ${tipos}"
                      th:value="${tipo.id}"
                      th:text="${tipo.nome}"
                    ></option>
                  </select>
                  <div class="invalid-feedback" th:errors="*{tipoId}"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="classificacao"
                    >Classificação *</label
                  ><select
                    class="form-select"
                    id="classificacao"
                    th:field="*{classificacao}"
                    th:errorclass="is-invalid"
                    onchange="alternarCliente()"
                  >
                    <option
                      th:each="item : ${classificacoes}"
                      th:value="${item}"
                      th:text="${item.descricao}"
                    ></option>
                  </select>
                  <div
                    class="invalid-feedback"
                    th:errors="*{classificacao}"
                  ></div>
                </div>
              </div>
              <div class="mb-4" id="campoCliente">
                <label class="form-label" for="clienteId">Cliente *</label
                ><select
                  class="form-select"
                  id="clienteId"
                  th:field="*{clienteId}"
                >
                  <option value="">Selecione o cliente</option>
                  <option
                    th:each="cliente : ${clientes}"
                    th:value="${cliente.id}"
                    th:text="${cliente.nome}"
                  ></option>
                </select>
                <div class="form-text">
                  Obrigatório somente para tarefas classificadas como Cliente.
                </div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-check-lg me-2"></i>Salvar</button
                ><a class="btn btn-outline-secondary" th:href="@{/tarefas}"
                  >Cancelar</a
                >
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script>
      function alternarCliente() {
        const c = document.getElementById("classificacao");
        const box = document.getElementById("campoCliente");
        const select = document.getElementById("clienteId");
        const cliente = c.value === "CLIENTE";
        box.style.display = cliente ? "block" : "none";
        select.required = cliente;
        if (!cliente) select.value = "";
      }
      document.addEventListener("DOMContentLoaded", alternarCliente);
    </script>
  </body>
</html>

<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav><div class="container-fluid"><div class="row"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="col-md-9 col-lg-10 p-4 p-lg-5"><h1 class="h3 mb-4">Dashboard</h1>
<div class="row g-3 mb-4"><div class="col-sm-6 col-xl"><div class="card metric"><div class="card-body"><span>Usuários</span><strong th:text="${resumo.usuarios}">0</strong></div></div></div><div class="col-sm-6 col-xl"><div class="card metric"><div class="card-body"><span>Tarefas</span><strong th:text="${resumo.tarefas}">0</strong></div></div></div><div class="col-sm-6 col-xl"><div class="card metric"><div class="card-body"><span>Atribuições</span><strong th:text="${resumo.atribuicoes}">0</strong></div></div></div><div class="col-sm-6 col-xl"><div class="card metric"><div class="card-body"><span>Supervisores</span><strong th:text="${resumo.supervisores}">0</strong></div></div></div><div class="col-sm-6 col-xl"><div class="card metric"><div class="card-body"><span>Operadores</span><strong th:text="${resumo.operadores}">0</strong></div></div></div></div>
<h2 class="h5 mb-3">Acesso rápido</h2><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-primary" th:href="@{/usuarios}">Usuários</a><a class="btn btn-outline-primary" th:href="@{/tarefas}">Tarefas</a><a class="btn btn-outline-primary" th:href="@{/atribuicoes}">Atribuições</a></div></main></div></div></body></html>

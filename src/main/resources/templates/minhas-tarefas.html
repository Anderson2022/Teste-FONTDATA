<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minhas tarefas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head>
<body><nav th:replace="~{fragments/layout :: navbar}"></nav><div class="container-fluid"><div class="row"><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="col-md-9 col-lg-10 p-4 p-lg-5"><h1 class="h3 mb-4">Minhas tarefas</h1><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Código</th><th>Nome</th><th>Tipo</th></tr></thead><tbody><tr th:each="item : ${atribuicoes}"><td th:text="${item.tarefa.id}"></td><td th:text="${item.tarefa.nome}"></td><td th:text="${item.tarefa.tipo.descricao}"></td></tr><tr th:if="${#lists.isEmpty(atribuicoes)}"><td colspan="3" class="text-center text-secondary py-4">Nenhuma tarefa atribuída.</td></tr></tbody></table></div></div></main></div></div></body></html>

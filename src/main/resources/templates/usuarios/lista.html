<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
  </head>
  <body class="app-page page-usuarios">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container-fluid">
      <div class="row">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-9 col-lg-10">
          <header class="page-heading">
            <h1>Usuários</h1>
            <p>Gerencie os usuários do sistema.</p>
          </header>
          <div
            th:if="${sucesso}"
            class="alert alert-success"
            th:text="${sucesso}"
          ></div>
          <section class="panel-card users-card">
            <div class="table-toolbar">
              <a class="btn btn-primary btn-new" th:href="@{/usuarios/novo}"
                ><i class="bi bi-plus-lg me-2"></i>Novo usuário</a
              >
            </div>
            <div class="table-responsive">
              <table class="table app-table align-middle">
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Usuário</th>
                    <th>Perfil</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.nome}"></td>
                    <td th:text="${usuario.username}"></td>
                    <td>
                      <span
                        class="profile-badge"
                        th:classappend="${usuario.perfil.name() == 'SUPERVISOR'} ? ' profile-supervisor' : ' profile-operador'"
                        th:text="${usuario.perfil.descricao}"
                      ></span>
                    </td>
                    <td>
                      <span
                        class="status-badge"
                        th:classappend="${usuario.ativo} ? ' status-active' : ' status-inactive'"
                        ><span class="status-dot"></span
                        ><span
                          th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'"
                        ></span
                      ></span>
                    </td>
                    <td class="text-end text-nowrap">
                      <a
                        class="btn btn-outline-primary action-btn me-2"
                        title="Editar usuário"
                        th:href="@{/usuarios/{id}/editar(id=${usuario.id})}"
                        ><i class="bi bi-pencil-fill"></i
                        ><span class="visually-hidden">Editar</span></a
                      >
                      <form
                        class="d-inline"
                        th:action="@{/usuarios/{id}/alternar-ativo(id=${usuario.id})}"
                        method="post"
                        onsubmit="
                          return confirm(
                            'Deseja alterar o status deste usuário?',
                          );
                        "
                      >
                        <button
                          class="btn action-btn"
                          th:classappend="${usuario.ativo} ? ' btn-outline-danger' : ' btn-outline-success'"
                          th:title="${usuario.ativo} ? 'Desativar usuário' : 'Ativar usuário'"
                          type="submit"
                        >
                          <i
                            class="bi"
                            th:classappend="${usuario.ativo} ? ' bi-power' : ' bi-check-circle-fill'"
                          ></i
                          ><span
                            class="visually-hidden"
                            th:text="${usuario.ativo} ? 'Desativar' : 'Ativar'"
                          ></span>
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6" class="text-center text-secondary py-5">
                      Nenhum usuário cadastrado.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>

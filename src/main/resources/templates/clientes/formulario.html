<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cliente</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
  </head>
  <body class="app-page page-clientes">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div class="container-fluid">
      <div class="row">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        <main class="col-md-9 col-lg-10">
          <header class="page-heading">
            <h1
              th:text="${cliente.id == null ? 'Novo cliente' : 'Editar cliente'}"
            ></h1>
          </header>
          <div
            th:if="${erro}"
            class="alert alert-danger"
            th:text="${erro}"
          ></div>
          <section class="panel-card p-4">
            <form
              th:object="${cliente}"
              th:action="${cliente.id == null ? '/clientes' : '/clientes/' + cliente.id}"
              method="post"
            >
              <input type="hidden" th:field="*{ativo}" />
              <div class="mb-4">
                <label class="form-label" for="nome">Nome *</label
                ><input
                  class="form-control"
                  id="nome"
                  th:field="*{nome}"
                  th:errorclass="is-invalid"
                  maxlength="150"
                  autofocus
                />
                <div class="invalid-feedback" th:errors="*{nome}"></div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary">
                  <i class="bi bi-check-lg me-2"></i>Salvar</button
                ><a class="btn btn-outline-secondary" th:href="@{/clientes}"
                  >Cancelar</a
                >
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
